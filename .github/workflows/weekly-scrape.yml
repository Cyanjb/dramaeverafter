# The weekly ReelShort refresh, unattended, on a GitHub runner.
#
# Why here: the cloud Claude sandbox cannot reach any platform (adapters.md
# sec 14) and the local route depended on someone remembering. The last real
# scrape before this workflow was 24 July 2026. GitHub's runners reach
# ReelShort (fetch-synopses proved it on 2 Sep 2026).
#
# What it does, in the pipeline skill's order: SCRAPE (scrape_reelshort.py, a
# dated staging JSON that is committed as the record), MERGE (merge_scrape.py,
# the database rules), GENERATE (build.py), then commit and push to the branch
# it ran on. On the schedule that is main, and push is publish: Netlify
# deploys in about 20 seconds. Cyan chose direct-to-main on 3 Sep 2026.
#
# Sunday 12:00 UTC is Sunday 14:00 in Johannesburg.
name: Weekly scrape

on:
  schedule:
    - cron: "0 12 * * 0"
  workflow_dispatch:
    inputs:
      dry_run:
        description: Scrape, merge and build, but commit nothing
        type: boolean
        default: false
      limit:
        description: Cap actor tag pages and detail fetches (0 = no cap). For a quick probe.
        default: "0"
      routes:
        description: Scrape routes, comma separated (tags,genres,home,fandom,wanted,sitemap,detail)
        default: "tags,genres,home,fandom,wanted,detail"

permissions:
  contents: write

concurrency:
  group: weekly-scrape-${{ github.ref }}
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Scrape ReelShort
        id: scrape
        run: |
          OUT="generator/staging/reelshort_$(date -u +%F).json"
          echo "out=$OUT" >> "$GITHUB_OUTPUT"
          python3 generator/scrape_reelshort.py \
            --out "$OUT" \
            --limit "${{ github.event.inputs.limit || '0' }}" \
            --routes "${{ github.event.inputs.routes || 'tags,genres,home,fandom,wanted,detail' }}"

      - name: Merge into data/
        id: merge
        run: |
          python3 generator/merge_scrape.py "${{ steps.scrape.outputs.out }}" --summary scrape-summary.md
          {
            echo "title<<EOF"
            grep -E '^\| (Known titles refreshed|New titles created|Held for a ruling)' scrape-summary.md \
              | sed -E 's/^\| ([^|]+) \| ([0-9]+) \|$/\2 \1/' | tr '\n' ',' | sed 's/,$//; s/,/, /g' \
              | sed -E 's/Known titles refreshed/refreshed/; s/New titles created/new/; s/Held for a ruling \(match_queue\)/held/'
            echo
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Build the site
        run: |
          cd generator && python3 build.py

      # SITE-CHECKS.md as code: a failure here stops the publish, so a broken
      # build turns the Actions run red instead of going live.
      - name: Check the built site
        run: python3 generator/check_site.py

      - name: Show what changed
        run: |
          git add -A
          git status --short | awk '{print $1}' | sort | uniq -c
          echo "data/ diffstat:"; git diff --cached --stat -- data | tail -3

      - name: Commit and push
        if: ${{ github.event.inputs.dry_run != 'true' }}
        run: |
          git config user.name "weekly-scrape workflow"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "nothing changed, nothing to commit"
            exit 0
          fi
          git commit -q -F - <<EOF
          Weekly scrape: ReelShort $(date -u +%F), ${{ steps.merge.outputs.title }}

          Unattended run of .github/workflows/weekly-scrape.yml. The staging
          JSON is the record of what the platform said; the summary is on the
          workflow run page.
          EOF
          for attempt in 1 2 3 4; do
            git pull --rebase -q origin "${{ github.ref_name }}" && git push origin "HEAD:${{ github.ref_name }}" && exit 0
            echo "push attempt $attempt failed, retrying"; sleep $((attempt * 5))
          done
          exit 1

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: weekly-scrape
          path: |
            ${{ steps.scrape.outputs.out }}
            scrape-summary.md
