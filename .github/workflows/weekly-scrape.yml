# The weekly ReelShort refresh, unattended, on a GitHub runner.
#
# Why here: the cloud Claude sandbox cannot reach any platform (adapters.md
# sec 14) and the local route depended on someone remembering. The last real
# scrape before this workflow was 24 July 2026. GitHub's runners reach
# ReelShort (fetch-synopses proved it on 2 Sep 2026).
#
# What it does, in the pipeline skill's order: SCRAPE (scrape_reelshort.py, a
# dated staging JSON that is committed as the record), MERGE (merge_scrape.py,
# the database rules), GENERATE (build.py), then commit and push to the branch
# it ran on. On the schedule that is main, and push is publish: Netlify
# deploys in about 20 seconds. Cyan chose direct-to-main on 3 Sep 2026.
#
# Sunday 12:00 UTC is Sunday 14:00 in Johannesburg.
name: Weekly scrape

on:
  schedule:
    - cron: "0 12 * * 0"
  workflow_dispatch:
    inputs:
      dry_run:
        description: Scrape, merge and build, but commit nothing
        type: boolean
        default: false
      limit:
        description: Cap actor tag pages and detail fetches (0 = no cap). For a quick probe.
        default: "0"
      routes:
        description: Scrape routes, comma separated (tags,genres,home,fandom,wanted,sitemap,detail)
        default: "tags,genres,home,fandom,wanted,detail"
      indexnow_all:
        description: Also resubmit every sitemap URL to IndexNow (Bing), not just what changed
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: weekly-scrape-${{ github.ref }}
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Scrape ReelShort
        id: scrape
        run: |
          OUT="generator/staging/reelshort_$(date -u +%F).json"
          echo "out=$OUT" >> "$GITHUB_OUTPUT"
          python3 generator/scrape_reelshort.py \
            --out "$OUT" \
            --limit "${{ github.event.inputs.limit || '0' }}" \
            --routes "${{ github.event.inputs.routes || 'tags,genres,home,fandom,wanted,detail' }}"

      - name: Merge into data/
        run: |
          python3 generator/merge_scrape.py "${{ steps.scrape.outputs.out }}" --summary scrape-summary.md

      - name: Build the site
        run: |
          cd generator && python3 build.py

      # SITE-CHECKS.md as code: a failure here stops the publish, so a broken
      # build turns the Actions run red instead of going live.
      - name: Check the built site
        run: python3 generator/check_site.py

      - name: Show what changed
        run: |
          git add -A
          git status --short | awk '{print $1}' | sort | uniq -c
          echo "data/ diffstat:"; git diff --cached --stat -- data | tail -3

      # If main moved while the run was scraping (a PR merged on a Sunday
      # afternoon), the push is rejected. Rebasing cannot fix that: the build
      # regenerates thousands of pages the PR also touched, so every rebase
      # conflicts, and the old loop never aborted the stuck rebase, so all
      # four retries failed the same way (20 Sep 2026, run 35518291897).
      # Instead: reset to the new main, replay the saved scrape through
      # merge, build and check, and push that. The slow part, the scrape
      # itself, is never repeated; the staging JSON is the record either way.
      - name: Commit and push
        if: ${{ github.event.inputs.dry_run != 'true' }}
        env:
          OUT: ${{ steps.scrape.outputs.out }}
          BRANCH: ${{ github.ref_name }}
        run: |
          git config user.name "weekly-scrape workflow"
          git config user.email "actions@users.noreply.github.com"
          cp "$OUT" "$RUNNER_TEMP/scrape.json"

          commit_all() {
            git add -A
            if git diff --cached --quiet; then
              echo "nothing changed, nothing to commit"
              return 1
            fi
            counts=$(grep -E '^\| (Known titles refreshed|New titles created|Held for a ruling)' scrape-summary.md \
              | sed -E 's/^\| ([^|]+) \| ([0-9]+) \|$/\2 \1/' | tr '\n' ',' | sed 's/,$//; s/,/, /g' \
              | sed -E 's/Known titles refreshed/refreshed/; s/New titles created/new/; s/Held for a ruling \(match_queue\)/held/')
            git commit -q -F - <<EOF
          Weekly scrape: ReelShort $(date -u +%F), $counts

          Unattended run of .github/workflows/weekly-scrape.yml. The staging
          JSON is the record of what the platform said; the summary is on the
          workflow run page.
          EOF
          }

          commit_all || exit 0
          for attempt in 1 2 3 4; do
            if git push origin "HEAD:$BRANCH"; then exit 0; fi
            echo "push attempt $attempt rejected: $BRANCH moved during the run. Redoing merge, build and check on the new $BRANCH."
            sleep $((attempt * 10))
            git fetch -q origin "$BRANCH"
            git reset -q --hard "origin/$BRANCH"
            mkdir -p "$(dirname "$OUT")" && cp "$RUNNER_TEMP/scrape.json" "$OUT"
            python3 generator/merge_scrape.py "$OUT" --summary scrape-summary.md
            (cd generator && python3 build.py)
            python3 generator/check_site.py
            commit_all || exit 0
          done
          echo "gave up after 4 rejected pushes; the scrape is in the weekly-scrape artifact"
          exit 1

      # Bing's push channel (10 Sep 2026): name the pages that changed so the
      # AI-search engines that lean on Bing see them in minutes. Never blocks
      # a publish; at worst Bing waits for the sitemap.
      - name: Tell Bing what changed (IndexNow)
        if: ${{ github.event.inputs.dry_run != 'true' }}
        continue-on-error: true
        run: |
          if [ "${{ github.event.inputs.indexnow_all }}" = "true" ]; then
            python3 generator/indexnow.py --all
          else
            python3 generator/indexnow.py --changed "${{ github.sha }}"
          fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: weekly-scrape
          path: |
            ${{ steps.scrape.outputs.out }}
            scrape-summary.md
